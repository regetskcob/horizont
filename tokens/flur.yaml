# The Flurkarte: every page of the family as a field seen from above, like
# the aerial photos of the Lower Rhine. One source for every site (web/
# partials/nav/karte.html) and, later, the about page of the apps.
#
# Gemarkungen are the sites. The first one is regetskcob with its fields;
# the products follow behind a field path, one parcel each. A product with
# its own domain sets "site" and may have "fields" too: on its own pages the
# map shows that gemarkung as the field map (karte.html, "map"). A project's
# "note" is its line on the map, "text" one sentence for the landing page,
# "status" a word for a project that is not out yet ("Vorschau").
#
# Per field:
#   id      stable key; a site passes it as "field" to mark where it is
#   name    as written on the field
#   path    below the gemarkung's site; root-relative
#   count   what lies on the field; a site may pass a live number
#           ("counts" in the partial), otherwise this one is shown
#   unit    singular and plural for the count
#   span    columns and rows on the six-column map; the area follows the
#           content, roughly: Blog 151 posts is the largest field
#   angle   direction of the furrows; neighbours differ, as on the land
#   mark    the glyph when it is not the gemarkung's (mark.html): the blog's
#           book; a project may set its own (Horizont's sun)
#   name_en, note_en  for pages in English (a product site with /en/)
#
# Jagdaufseher is off the map since 2026-10-22: its landing page is offline
# and its backend deleted while the work goes into KNX Monitor. Its entry
# comes back here when the page does.
#
# The counts are as of 2026-10-20. A site that knows its own numbers (the
# blog counts its posts) passes them in; the others keep these.

site: https://www.regetskcob.de

gemarkungen:
  - id: regetskcob
    name: regetskcob
    product: regetskcob
    path: /
    fields:
      - id: blog
        name: Blog
        mark: blog
        path: /blog/
        count: 151
        unit: [Beitrag, Beiträge]
        span: [3, 4]
        angle: 45
      - id: galerie
        name: Galerie
        path: /galerie/
        count: 100
        unit: [Foto, Fotos]
        span: [2, 2]
        angle: 0
      - id: niederrhein
        name: Niederrhein.
        path: /niederrhein/
        count: 52
        unit: [Foto, Fotos]
        note: Serie
        span: [1, 2]
        angle: 90
      - id: ausruestung
        name: Ausrüstung
        path: /ausruestung/
        count: 33
        unit: [Teil, Teile]
        span: [2, 1]
        angle: 135
      - id: rezepte
        name: Film-Rezepte
        path: /rezepte/
        count: 3
        unit: [Rezept, Rezepte]
        span: [1, 1]
        angle: 60
      - id: ueber
        name: Über
        path: /about/
        span: [3, 1]
        angle: 0

  - id: horizont
    name: Horizont
    product: regetskcob
    mark: horizont
    path: /horizont/
    note: Designsystem
    text: "Das gemeinsame Designsystem von Blog und Apps: Farben, Schrift, Zeichen und Bausteine für Web und Flutter."

  - id: knx
    name: KNX Monitor
    product: knx
    site: https://knx-monitor.de
    path: /
    status: Vorschau
    note: Busmonitor & Diagnose
    text: "Zeigt jedes Telegramm auf dem KNX-Bus, ordnet es dem ETS-Projekt zu und prüft die Anlage."
    fields:
      - id: start
        name: KNX Monitor
        path: /
        note: Busmonitor & Diagnose
        note_en: Bus monitor & diagnostics
        span: [3, 3]
        angle: 45
      - id: addon
        name: Add-on
        path: /addon/
        note: Home Assistant
        span: [3, 2]
        angle: 0
      - id: box
        name: KNX-Box
        name_en: KNX box
        path: /box/
        note: Raspberry Pi · Vorschau
        note_en: Raspberry Pi · preview
        span: [2, 1]
        angle: 90
      - id: feedback
        name: Feedback
        path: /feedback/
        note: Diagnosepaket
        note_en: Diagnostics package
        span: [1, 1]
        angle: 135

  - id: panzergefecht
    name: Panzergefecht
    product: panzergefecht
    site: https://panzergefecht.de
    path: /
    status: Vorschau
    note: Panzerduelle und Verteidigung
    text: "Ein schnelles Panzerduell von oben: allein, gegeneinander oder im Trupp, im Browser und als App."
